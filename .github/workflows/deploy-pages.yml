name: Deploy Customer Code Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: customer-code-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check dashboard runtime
        run: |
          node --check app.js
          node --check channel-products.js
          node --check experience.js
      - name: Verify embedded database
        run: node scripts/verify.mjs
      - name: Build single-file Pages databases
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const build=(manifestPath,outPath)=>{
            const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
            const parts=manifest.chunks.map(rel=>Buffer.from(fs.readFileSync(rel,'utf8').trim(),'base64'));
            fs.writeFileSync(outPath,Buffer.concat(parts));
          };
          build('data/manifest.json','data/customer-master.gz');
          build('data/relations-manifest.json','data/relations-master.gz');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
