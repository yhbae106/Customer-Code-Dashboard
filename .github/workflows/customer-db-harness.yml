name: Customer DB Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check dashboard runtime
        run: |
          node --check app.js
          node --check channel-products.js
          node --check experience.js
      - name: Verify embedded customer database
        run: node scripts/verify.mjs
